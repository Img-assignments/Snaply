name: snaply
description: "A Pinterest-style Flutter photo app powered by Pexels and Firebase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase & Auth
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0

  # State Management & Storage
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # Networking & UI Utilities
  http: ^1.2.1
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.3.1
  share_plus: ^9.0.0
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png